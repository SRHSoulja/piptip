name: PIPTip Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: piptip_test
          POSTGRES_PASSWORD: test_password_change_in_production
          POSTGRES_DB: piptip_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        run: |
          cp .env.example .env.test
          echo "TEST_DATABASE_URL=postgresql://piptip_test:test_password_change_in_production@localhost:5433/piptip_test" >> .env.test
          echo "REDIS_URL=redis://localhost:6380" >> .env.test
          echo "NODE_ENV=test" >> .env.test

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://piptip_test:test_password_change_in_production@localhost:5433/piptip_test

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Seed test database
        run: npm run test:seed

      - name: Run backend test suite
        run: ./RUN_ALL_TESTS.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: TEST_RESULTS_*.md

  discord-integration:
    name: Discord Integration Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: piptip_test
          POSTGRES_PASSWORD: test_password_change_in_production
          POSTGRES_DB: piptip_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        run: |
          cp .env.example .env.test
          echo "TEST_DATABASE_URL=postgresql://piptip_test:test_password_change_in_production@localhost:5433/piptip_test" >> .env.test
          echo "NODE_ENV=test" >> .env.test

      - name: Run Prisma setup
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npm run test:seed
        env:
          DATABASE_URL: postgresql://piptip_test:test_password_change_in_production@localhost:5433/piptip_test

      - name: Run Discord integration tests
        run: npm run test:discord-integration

  scaling-tests:
    name: Scaling & Failover Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: piptip_test
          POSTGRES_PASSWORD: test_password_change_in_production
          POSTGRES_DB: piptip_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        run: |
          cp .env.example .env.test
          echo "TEST_DATABASE_URL=postgresql://piptip_test:test_password_change_in_production@localhost:5433/piptip_test" >> .env.test
          echo "NODE_ENV=test" >> .env.test

      - name: Run Prisma setup
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npm run test:seed
        env:
          DATABASE_URL: postgresql://piptip_test:test_password_change_in_production@localhost:5433/piptip_test

      - name: Run scaling tests
        run: npm run test:scaling-failover

  smoke-tests:
    name: Smoke Tests (Quick Validation)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run lint || echo "Linting not configured"

      - name: Build check
        run: npm run build

  deployment-ready:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [backend-tests, discord-integration, scaling-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Deployment checklist
        run: |
          echo "✅ Backend tests passed"
          echo "✅ Discord integration tests passed"
          echo "✅ Scaling tests passed"
          echo "🚀 Ready for deployment"

      - name: Create deployment marker
        run: |
          echo "DEPLOYMENT_READY=true" >> $GITHUB_ENV
          echo "DEPLOYMENT_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Notify deployment ready
        run: |
          echo "::notice::All tests passed. Deployment authorized for commit ${{ github.sha }}"
