name: Cross-System Reconciliation Validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      network:
        description: 'Network to validate (testnet/mainnet)'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet

env:
  NODE_VERSION: '20.x'

jobs:
  validate-testnet:
    name: Validate Testnet Reconciliation
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.network == 'testnet'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: piptip_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: |
          echo "NETWORK=testnet" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/piptip_test" >> $GITHUB_ENV
          echo "ABSTRACT_RPC_TESTNET=${{ secrets.ABSTRACT_RPC_TESTNET }}" >> $GITHUB_ENV
          echo "TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/piptip_test" >> $GITHUB_ENV

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run cross-system validation
        id: validation
        run: npm run validate:cross:testnet
        continue-on-error: true

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-testnet-${{ github.run_number }}
          path: reports/validation-*.json
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportFiles = fs.readdirSync('reports').filter(f => f.startsWith('validation-'));

            if (reportFiles.length === 0) {
              console.log('No validation reports found');
              return;
            }

            const reportPath = `reports/${reportFiles[reportFiles.length - 1]}`;
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            const passed = report.success;
            const emoji = passed ? '✅' : '❌';

            const body = `## ${emoji} Cross-System Reconciliation Report (Testnet)

            **Status:** ${passed ? 'PASSED' : 'FAILED'}
            **Network:** ${report.network}
            **Timestamp:** ${report.timestamp}

            ### Summary
            - **Total Checks:** ${report.summary.totalChecks}
            - **Passed:** ${report.summary.passedChecks}
            - **Failed:** ${report.summary.failedChecks}
            - **Warnings:** ${report.summary.warningCount}

            ### Check Results
            | Check | Status |
            |-------|--------|
            | Balance Conservation | ${report.checks.balanceConservation.passed ? '✅' : '❌'} |
            | Operation Coverage | ${report.checks.operationCoverage.passed ? '✅' : '❌'} |
            | Rake Validation | ${report.checks.rakeValidation.passed ? '✅' : '❌'} |
            | On-Chain Verification | ${report.checks.onChainVerification.passed ? '✅' : '❌'} |
            | Merkle Consistency | ${report.checks.merkleConsistency.passed ? '✅' : '❌'} |
            | Treasury Flow | ${report.checks.treasuryFlow.passed ? '✅' : '❌'} |

            ${report.summary.failedChecks > 0 ? '⚠️ **Action Required:** Fix validation errors before merging.' : ''}

            <details>
            <summary>📄 View Full Report</summary>

            \`\`\`json
            ${JSON.stringify(report, null, 2)}
            \`\`\`
            </details>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail workflow if validation failed
        if: steps.validation.outcome == 'failure'
        run: |
          echo "❌ Cross-system reconciliation validation failed"
          echo "Review the validation report for details"
          exit 1

  validate-mainnet:
    name: Validate Mainnet Reconciliation
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'mainnet') || github.event_name == 'schedule'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: |
          echo "NETWORK=mainnet" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DATABASE_URL_MAINNET }}" >> $GITHUB_ENV
          echo "ABSTRACT_RPC_MAINNET=${{ secrets.ABSTRACT_RPC_MAINNET }}" >> $GITHUB_ENV

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run cross-system validation
        id: validation
        run: npm run validate:cross
        continue-on-error: true

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-mainnet-${{ github.run_number }}
          path: reports/validation-*.json
          retention-days: 90

      - name: Send Slack notification on failure
        if: steps.validation.outcome == 'failure'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Mainnet Reconciliation Validation Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ Mainnet Reconciliation Validation Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ *Action Required:* Review validation report and fix discrepancies immediately."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Fail workflow if validation failed
        if: steps.validation.outcome == 'failure'
        run: |
          echo "❌ Mainnet cross-system reconciliation validation failed"
          echo "CRITICAL: Review the validation report immediately"
          exit 1

  run-stress-test:
    name: Run Stress Test (Weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'testnet')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: piptip_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: |
          echo "NETWORK=testnet" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/piptip_test" >> $GITHUB_ENV

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run stress test
        run: npm run test:stress-reconciliation
        continue-on-error: true

      - name: Upload stress test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-report-${{ github.run_number }}
          path: reports/stress-test-*.json
          retention-days: 30