<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIPTip Server Management - Select Server</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            font-weight: 700;
        }
        .header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1rem;
        }
        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .server-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .server-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .server-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        .server-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .server-name {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .server-id {
            font-size: 0.9rem;
            opacity: 0.7;
            font-family: monospace;
            margin-bottom: 15px;
        }
        .server-permissions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .permission-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .admin-badge {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .no-servers {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            margin-top: 30px;
        }
        .no-servers h3 {
            margin-bottom: 15px;
            color: #fbbf24;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-decoration: none;
            color: #e5e5e5;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Server Management</h1>
            <p>Choose a server to manage PIPTip settings</p>
            <div class="user-info">
                <span>👋 Welcome, <strong>{{USER_NAME}}</strong></span>
            </div>
        </div>

        <div id="servers-container">
            <!-- Servers will be loaded here -->
        </div>

        <div style="text-align: center;">
            <a href="/pengubook" class="back-link">← Back to PenguBook</a>
        </div>
    </div>

    <script>
        // Server data injected by server
        const servers = {{SERVERS_JSON}};

        function renderServers() {
            const container = document.getElementById('servers-container');

            if (!servers || servers.length === 0) {
                container.innerHTML = `
                    <div class="no-servers">
                        <h3>⚠️ No Manageable Servers</h3>
                        <p>You don't have administrator permissions in any servers that use PIPTip.</p>
                        <p>You need either <strong>Administrator</strong> or <strong>Manage Server</strong> permissions to access server management.</p>
                    </div>
                `;
                return;
            }

            const serversHtml = servers.map(server => {
                const permissions = parseInt(server.permissions);
                const isAdmin = (permissions & 0x8) === 0x8;
                const canManage = (permissions & 0x20) === 0x20;

                const permissionBadges = [];
                if (isAdmin) {
                    permissionBadges.push('<span class="permission-badge admin-badge">Administrator</span>');
                } else if (canManage) {
                    permissionBadges.push('<span class="permission-badge">Manage Server</span>');
                }

                return `
                    <div class="server-card" onclick="selectServer('${server.id}', '${server.name}')">
                        <div class="server-icon">
                            ${server.icon ? `<img src="https://cdn.discordapp.com/icons/${server.id}/${server.icon}.png" style="width: 64px; height: 64px; border-radius: 50%;">` : '🛡️'}
                        </div>
                        <div class="server-name">${escapeHtml(server.name)}</div>
                        <div class="server-id">ID: ${server.id}</div>
                        <div class="server-permissions">
                            ${permissionBadges.join('')}
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="servers-grid">${serversHtml}</div>`;
        }

        function selectServer(serverId, serverName) {
            // Navigate to server dashboard
            window.location.href = `/server/${serverId}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', renderServers);
    </script>
</body>
</html>
